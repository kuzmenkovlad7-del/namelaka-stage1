server {
  listen 80;
  listen [::]:80;
  server_name 46.62.234.91 _;

  root /var/www/namelaka-react-app/dist;
  index index.html;

  access_log /var/log/nginx/namelaka-react-access.log;
  error_log  /var/log/nginx/namelaka-react-error.log;

  location = / { return 302 /ua/; }
  location = /ua { return 302 /ua/; }
  location = /en { return 302 /en/; }

  location /api/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /_health {
    proxy_pass http://127.0.0.1:3010/_health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /ua/ {
    try_files $uri $uri/ /index.html;
  }

  location /en/ {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
